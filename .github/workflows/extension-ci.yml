name: CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/vscode-extension/**'
      - 'apps/orm/src/parser/**'
      - 'apps/orm/src/formatter/**'
      - 'apps/orm/src/resolver/**'
      - 'apps/orm/src/types/**'
      - 'apps/orm/src/cli/config/types.ts'
      - 'apps/orm/src/cli/validators/**'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/vscode-extension/**'
      - 'apps/orm/src/parser/**'
      - 'apps/orm/src/formatter/**'
      - 'apps/orm/src/resolver/**'
      - 'apps/orm/src/types/**'
      - 'apps/orm/src/cli/config/types.ts'
      - 'apps/orm/src/cli/validators/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
        working-directory: apps/vscode-extension
      - run: bun run build
        working-directory: apps/vscode-extension
      - run: bunx tsc --noEmit -p .
        working-directory: apps/vscode-extension
      - run: bun run compile:tests
        working-directory: apps/vscode-extension
      - run: bun test tests/unit/
        working-directory: apps/vscode-extension
      - run: bun test tests/grammar/
        working-directory: apps/vscode-extension
