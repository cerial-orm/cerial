name: ORM CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'apps/orm/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'tooling/**'
      - '.github/workflows/orm-ci.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/orm/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'tooling/**'
      - '.github/workflows/orm-ci.yml'

permissions:
  contents: read

concurrency:
  group: orm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
        working-directory: apps/orm
      # tsc resolves `cerial` to the built package and checks tests against the generated clients
      - run: bun run build
        working-directory: apps/orm
      - run: bun run generate:test-client
        working-directory: apps/orm
      - run: bun run generate:mixed-client
        working-directory: apps/orm
      - run: bunx tsc --noEmit
        working-directory: apps/orm
      - run: bun run test
        working-directory: apps/orm

  typescript-range:
    # A tested floor, open forward. The peer range is >=5.9.3, so this proves the floor and the
    # current latest both compile the generated types, declaration files included (skipLibCheck
    # false). A version nobody ran is not promised.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.9.3', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
      # tsc resolves `cerial` to the built package. Built with the pinned compiler: under TypeScript 7 the
      # declaration step type-checks the test files too, so the package is built before the swap.
      - run: bun run build
        working-directory: apps/orm
      - run: bun add --dev typescript@${{ matrix.typescript }}
        working-directory: apps/orm
      - run: bunx tsc --version
        working-directory: apps/orm
      - run: bun run generate:test-client
        working-directory: apps/orm
      # Generating from *.schema.ts modules must work whichever compiler this job installed
      - run: bun run generate:test-client-ts
        working-directory: apps/orm
      # tsc checks tests against the generated mixed client
      - run: bun run generate:mixed-client
        working-directory: apps/orm
      - run: bunx tsc --noEmit
        working-directory: apps/orm
      - run: bun run typecheck
        working-directory: apps/orm
      # The compiler this job installed, not the pinned aliases
      - run: bun run typecheck:generated -- --resolved
        working-directory: apps/orm
      # The 'ts' layout; `typecheck` above covers the default '.d.ts' layout
      - run: bun run typecheck:layout
        working-directory: apps/orm

  commit-hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - run: bun install --frozen-lockfile
      # Reads every tracked file and the recorded cast counts, so a commit made with
      # --no-verify is still caught here.
      - run: bun run tooling/hooks/check-tree.ts
      # Own tsconfig: the repo-root program also loads apps/docs globals that break these files.
      - run: bunx tsc --noEmit -p tooling
      - run: bun test tooling/hooks tooling/release

  node-typescript:
    name: TypeScript schemas and convert on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release in the package's engines range, and the current 22 LTS
        node: ['22.12.0', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/orm
      - run: bun test tests/integration/typescript-node.test.ts tests/integration/convert-bin.test.ts
        working-directory: apps/orm

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - name: Install SurrealDB
        env:
          # Keep in step with docs/surrealdb-compatibility.mdx.
          # Checksum is of surreal-$SURREAL_VERSION.linux-amd64.tgz from the
          # GitHub release; re-compute it when bumping the version.
          SURREAL_VERSION: v4.0.0
          SURREAL_SHA256: e910760179b9f13d0773ce98ac50f9a537051156365239284c2dc687adf3049d
        run: |
          curl -sSfL -o surreal.tgz \
            "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz"
          echo "${SURREAL_SHA256}  surreal.tgz" | sha256sum -c -
          tar -xzf surreal.tgz
          sudo install -m 755 surreal /usr/local/bin/surreal
          surreal version
      - name: Start SurrealDB
        run: |
          surreal start --user root --pass root --bind 0.0.0.0:8000 memory &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is ready"
              break
            fi
            echo "Waiting for SurrealDB... ($i/30)"
            sleep 2
          done
      - run: bun install --frozen-lockfile
      - run: bun run generate:test-client
        working-directory: apps/orm
      - run: bun run build
        working-directory: apps/orm
      - run: bun run typecheck
        working-directory: apps/orm
      - run: bun run test:integration
        working-directory: apps/orm
      - run: bun run test:e2e
        working-directory: apps/orm
      # The 'ts' schema corpus, after the default run: one run at a time touches the instance
      - run: bun run typecheck:ts
        working-directory: apps/orm
      - run: bun run test:e2e:ts
        working-directory: apps/orm
