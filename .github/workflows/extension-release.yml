name: Extension Release

on:
  push:
    tags: ['ext-v*']
  workflow_dispatch:

concurrency:
  group: ext-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only orm-v*/ext-v* tags may deploy to this environment, and the maintainer
    # approves each run before it starts.
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/vscode-extension

      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/ext-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
        working-directory: apps/vscode-extension

      - name: Build
        run: bun run build
        working-directory: apps/vscode-extension

      - name: Run tests
        run: bun run test
        working-directory: apps/vscode-extension

      - name: Package VSIX
        run: bun run package
        working-directory: apps/vscode-extension

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/ext-v}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2 | tr '.' '/')
          gh release create "$GITHUB_REF_NAME" \
            --title "Cerial VS Code Extension v$VERSION" \
            --notes "Full release notes: https://cerial-orm.github.io/cerial/releases/extension/${MINOR}#$(echo $VERSION | tr -d '.')" \
            apps/vscode-extension/*.vsix

