name: ORM Release

on:
  push:
    tags: ['orm-v*']
  workflow_dispatch:

concurrency:
  group: orm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/orm

      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/orm-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
        working-directory: apps/orm

      - name: Run tests
        run: bun run test
        working-directory: apps/orm

      - name: Build
        run: bun run build
        working-directory: apps/orm

      # Publish FIRST so a publish failure never leaves a dangling GitHub Release
      # to block re-runs. Idempotent: skip if this version is already on the registry.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/orm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cerial@$VERSION" version > /dev/null 2>&1; then
            echo "cerial@$VERSION is already published, skipping publish."
          else
            npm publish --access public --provenance
          fi

      # Create-or-edit so a re-run never hard-fails on "release already exists".
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/orm-v}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2 | tr '.' '/')
          NOTES="Full release notes: https://cerial-orm.github.io/cerial/releases/orm/${MINOR}#$(echo $VERSION | tr -d '.')"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, updating."
            gh release edit "$GITHUB_REF_NAME" \
              --title "Cerial ORM v$VERSION" \
              --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Cerial ORM v$VERSION" \
              --notes "$NOTES"
          fi
