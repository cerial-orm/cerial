name: ORM Release

on:
  push:
    tags: ['orm-v*']
  workflow_dispatch:

concurrency:
  group: orm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only orm-v*/ext-v* tags may deploy to this environment, and the maintainer
    # approves each run before it starts.
    environment: npm-publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # The release job's own `bun run test` covers the unit suites only. The
      # typecheck, integration and e2e suites that cover query building run in
      # ORM CI, so the release requires that CI passed on this exact commit
      # rather than re-running a subset here.
      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/orm-ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$RUN" ]; then
            echo "::error::ORM CI has not run for ${GITHUB_SHA}. Run it on that commit before tagging."
            exit 1
          fi
          read -r STATUS CONCLUSION URL <<< "$RUN"
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::ORM CI for ${GITHUB_SHA} is $STATUS/$CONCLUSION, not completed/success. $URL"
            exit 1
          fi
          echo "ORM CI passed for ${GITHUB_SHA}: $URL"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/orm

      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/orm-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
        working-directory: apps/orm

      # The tests import the built package and the generated test clients, as in ORM CI
      - name: Build
        run: bun run build
        working-directory: apps/orm

      - name: Generate test clients
        run: bun run generate:test-client && bun run generate:mixed-client
        working-directory: apps/orm

      - name: Run tests
        run: bun run test
        working-directory: apps/orm

      # Publish FIRST so a publish failure never leaves a dangling GitHub Release
      # to block re-runs. Idempotent: skip if this version is already on the registry.
      # Trusted publishing: npm exchanges this job's OIDC identity (id-token: write)
      # for a one-off credential, so no npm token is stored anywhere. It needs
      # npm 11.5.1 or newer.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/orm
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm -v)" \
            || { echo "::error::npm $(npm -v) is too old for trusted publishing (needs 11.5.1+)"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cerial@$VERSION" version > /dev/null 2>&1; then
            echo "cerial@$VERSION is already published, skipping publish."
          else
            npm publish --access public --provenance
          fi

      # Create-or-edit so a re-run never hard-fails on "release already exists".
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/orm-v}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2 | tr '.' '/')
          NOTES="Full release notes: https://cerial-orm.github.io/cerial/releases/orm/${MINOR}#$(echo $VERSION | tr -d '.')"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, updating."
            gh release edit "$GITHUB_REF_NAME" \
              --title "Cerial ORM v$VERSION" \
              --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Cerial ORM v$VERSION" \
              --notes "$NOTES"
          fi
